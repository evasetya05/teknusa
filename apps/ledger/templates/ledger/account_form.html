{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Buat Akun Baru - Modul Ledger{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'ledger/css/account_form.css' %}">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <a href="{% url 'ledger:account_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Kembali ke Daftar Akun
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <h2 class="mb-4">Buat Akun Baru</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Simpan Akun</button>
        </form>
    </div>
</div>
{% endblock %}
