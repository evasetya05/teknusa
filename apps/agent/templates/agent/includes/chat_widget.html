<!-- Floating report chat (admins only). History is kept in sessionStorage; nothing is stored server-side. -->
<style>
  #agent-chat-fab { position: fixed; right: 24px; bottom: 24px; z-index: 1050; width: 56px; height: 56px;
    border-radius: 50%; border: 0; color: #fff; font-size: 1.4rem; cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #7c3aed); box-shadow: 0 8px 24px rgba(79,70,229,.45);
    transition: transform .15s ease; }
  #agent-chat-fab:hover { transform: scale(1.08); }
  #agent-chat-panel { position: fixed; right: 24px; bottom: 92px; z-index: 1050; width: 380px; max-width: calc(100vw - 32px);
    height: 540px; max-height: calc(100vh - 110px); display: none; flex-direction: column; background: #fff;
    border-radius: 16px; box-shadow: 0 16px 48px rgba(15,23,42,.25); overflow: hidden; }
  #agent-chat-panel.open { display: flex; }
  #agent-chat-head { padding: 10px 14px; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: flex; justify-content: space-between; align-items: center; }
  #agent-chat-log { flex: 1; overflow-y: auto; padding: 10px 12px; background: #f8fafc; }
  .agent-msg { max-width: 88%; margin-bottom: 8px; padding: 7px 11px; border-radius: 12px; font-size: .84rem;
    line-height: 1.42; white-space: pre-wrap; word-wrap: break-word; }
  .agent-msg.user { margin-left: auto; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
  .agent-msg.assistant { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .agent-msg small { display: block; margin-top: 3px; opacity: .65; font-size: .68rem; }
  #agent-chat-suggest { display: flex; gap: 6px; padding: 6px 10px; background: #f8fafc; border-top: 1px solid #eef2f6;
    overflow-x: auto; white-space: nowrap; scrollbar-width: none; -ms-overflow-style: none; }
  #agent-chat-suggest::-webkit-scrollbar { display: none; }
  #agent-chat-suggest button { flex-shrink: 0; border-radius: 16px; font-size: .75rem; padding: 3px 10px;
    border: 1px solid #cbd5e1; color: #475569; background: #fff; transition: all .15s ease; }
  #agent-chat-suggest button:hover { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  #agent-chat-form { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid #e2e8f0; background: #fff; }
</style>

<button id="agent-chat-fab" type="button" aria-label="Open report chat" title="Ask reports"><i class="fas fa-comments"></i></button>

<section id="agent-chat-panel" aria-label="Report chat">
  <div id="agent-chat-head">
    <strong class="small"><i class="fas fa-robot me-2"></i>Report Assistant</strong>
    <span>
      <button id="agent-chat-clear" type="button" class="btn btn-sm btn-link text-white text-decoration-none py-0 px-1" title="Clear conversation">Clear</button>
      <button id="agent-chat-close" type="button" class="btn btn-sm btn-link text-white text-decoration-none py-0 px-1 fs-5 lh-1" aria-label="Close">&times;</button>
    </span>
  </div>
  <div id="agent-chat-log" aria-live="polite"></div>
  <div id="agent-chat-suggest">
    <button type="button" class="btn btn-sm">Profit this month?</button>
    <button type="button" class="btn btn-sm">Alerts needing attention?</button>
    <button type="button" class="btn btn-sm">Overdue tasks & leads?</button>
  </div>
  <form id="agent-chat-form" autocomplete="off">
    {% csrf_token %}
    <input id="agent-chat-input" class="form-control form-control-sm" maxlength="500" placeholder="Ask about finance, kanban, or leads..." required>
    <button id="agent-chat-send" class="btn btn-primary btn-sm" type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</section>

<script>
(function () {
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[2]) : "";
  }
  var URL = "{% url 'agent:chat' %}";
  var KEY = "agent-chat-history";
  var fab = document.getElementById("agent-chat-fab"), panel = document.getElementById("agent-chat-panel");
  var log = document.getElementById("agent-chat-log"), form = document.getElementById("agent-chat-form");
  var input = document.getElementById("agent-chat-input"), send = document.getElementById("agent-chat-send");
  var suggest = document.getElementById("agent-chat-suggest");
  var csrfInput = form ? form.querySelector('[name=csrfmiddlewaretoken]') : null;
  var CSRF = (csrfInput ? csrfInput.value : "") || "{{ csrf_token }}" || getCookie("csrftoken");
  var history = [];
  try { history = JSON.parse(sessionStorage.getItem(KEY) || "[]"); } catch (e) { history = []; }

  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(history.slice(-20))); } catch (e) {} }
  function add(role, text, meta) {
    var div = document.createElement("div");
    div.className = "agent-msg " + role;
    div.textContent = text;                       // textContent: never interpret model output as HTML
    if (meta) { var s = document.createElement("small"); s.textContent = meta; div.appendChild(s); }
    log.appendChild(div); log.scrollTop = log.scrollHeight;
    return div;
  }
  function updateSuggest() {
    if (suggest) {
      suggest.style.display = history.length ? "none" : "flex";
    }
  }
  function render() {
    log.innerHTML = "";
    if (!history.length) add("assistant", "Hello! Ask me anything about finance, kanban, or leads in this dashboard.");
    history.forEach(function (t) { add(t.role, t.text, t.meta); });
    updateSuggest();
  }
  function ask(text) {
    text = text.trim(); if (!text) return;
    var prior = history.map(function (t) { return {role: t.role, text: t.text}; });
    history.push({role: "user", text: text}); add("user", text);
    if (suggest) suggest.style.display = "none";
    var wait = add("assistant", "Thinking…");
    send.disabled = true; input.disabled = true;
    var currentCsrf = (form && form.querySelector('[name=csrfmiddlewaretoken]') ? form.querySelector('[name=csrfmiddlewaretoken]').value : "") || CSRF || getCookie("csrftoken");
    fetch(URL, {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": currentCsrf},
      body: JSON.stringify({message: text, history: prior})
    })
      .then(function (r) {
        return r.json().catch(function () {
          return {ok: false, error: "Invalid server response (HTTP " + r.status + ")."};
        });
      })
      .then(function (res) {
        wait.remove();
        if (!res.ok) { add("assistant", res.error || "An error occurred."); return; }
        var meta = res.source === "fallback" ? "report summary (deterministic fallback)" : "answered by " + res.source;
        history.push({role: "assistant", text: res.answer, meta: meta});
        add("assistant", res.answer, meta); save();
      })
      .catch(function () { wait.remove(); add("assistant", "Failed to connect to server."); })
      .finally(function () { send.disabled = false; input.disabled = false; input.focus(); });
  }

  fab.addEventListener("click", function () { panel.classList.toggle("open"); if (panel.classList.contains("open")) input.focus(); });
  document.getElementById("agent-chat-close").addEventListener("click", function () { panel.classList.remove("open"); });
  document.getElementById("agent-chat-clear").addEventListener("click", function () { history = []; save(); render(); });
  form.addEventListener("submit", function (e) { e.preventDefault(); var v = input.value; input.value = ""; ask(v); });
  document.querySelectorAll("#agent-chat-suggest button").forEach(function (b) {
    b.addEventListener("click", function () { ask(b.textContent); });
  });
  render();
})();
</script>
