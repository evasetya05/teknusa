<!-- Floating report chat (admins only). History is kept in sessionStorage; nothing is stored server-side. -->
<style>
  #agent-chat-fab { position: fixed; right: 24px; bottom: 24px; z-index: 1050; width: 56px; height: 56px;
    border-radius: 50%; border: 0; color: #fff; font-size: 1.4rem; cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #7c3aed); box-shadow: 0 8px 24px rgba(79,70,229,.45);
    transition: transform .15s ease; }
  #agent-chat-fab:hover { transform: scale(1.08); }
  #agent-chat-panel { position: fixed; right: 24px; bottom: 92px; z-index: 1050; width: 380px; max-width: calc(100vw - 32px);
    height: 520px; max-height: calc(100vh - 120px); display: none; flex-direction: column; background: #fff;
    border-radius: 16px; box-shadow: 0 16px 48px rgba(15,23,42,.25); overflow: hidden; }
  #agent-chat-panel.open { display: flex; }
  #agent-chat-head { padding: 12px 16px; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: flex; justify-content: space-between; align-items: center; }
  #agent-chat-log { flex: 1; overflow-y: auto; padding: 12px; background: #f8fafc; }
  .agent-msg { max-width: 88%; margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; font-size: .88rem;
    white-space: pre-wrap; word-wrap: break-word; }
  .agent-msg.user { margin-left: auto; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
  .agent-msg.assistant { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .agent-msg small { display: block; margin-top: 4px; opacity: .6; font-size: .7rem; }
  #agent-chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e2e8f0; background: #fff; }
  #agent-chat-suggest { padding: 6px 12px 0; background: #f8fafc; }
  #agent-chat-suggest button { margin: 0 4px 6px 0; }
</style>

<button id="agent-chat-fab" type="button" aria-label="Buka chat laporan" title="Tanya laporan"><i class="fas fa-comments"></i></button>

<section id="agent-chat-panel" aria-label="Chat laporan">
  <div id="agent-chat-head">
    <strong><i class="fas fa-robot me-2"></i>Tanya Laporan</strong>
    <span>
      <button id="agent-chat-clear" type="button" class="btn btn-sm btn-link text-white" title="Hapus percakapan">Bersihkan</button>
      <button id="agent-chat-close" type="button" class="btn btn-sm btn-link text-white" aria-label="Tutup">&times;</button>
    </span>
  </div>
  <div id="agent-chat-log" aria-live="polite"></div>
  <div id="agent-chat-suggest">
    <button type="button" class="btn btn-outline-primary btn-sm">Bagaimana laba bulan ini?</button>
    <button type="button" class="btn btn-outline-primary btn-sm">Apa alert yang perlu perhatian?</button>
    <button type="button" class="btn btn-outline-primary btn-sm">Tugas kanban apa yang terlambat?</button>
  </div>
  <form id="agent-chat-form" autocomplete="off">
    <input id="agent-chat-input" class="form-control form-control-sm" maxlength="500" placeholder="Tanya tentang laporan..." required>
    <button id="agent-chat-send" class="btn btn-primary btn-sm" type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</section>

<script>
(function () {
  var URL = "{% url 'agent:chat' %}", CSRF = "{{ csrf_token }}", KEY = "agent-chat-history";
  var fab = document.getElementById("agent-chat-fab"), panel = document.getElementById("agent-chat-panel");
  var log = document.getElementById("agent-chat-log"), form = document.getElementById("agent-chat-form");
  var input = document.getElementById("agent-chat-input"), send = document.getElementById("agent-chat-send");
  var history = [];
  try { history = JSON.parse(sessionStorage.getItem(KEY) || "[]"); } catch (e) { history = []; }

  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(history.slice(-20))); } catch (e) {} }
  function add(role, text, meta) {
    var div = document.createElement("div");
    div.className = "agent-msg " + role;
    div.textContent = text;                       // textContent: never interpret model output as HTML
    if (meta) { var s = document.createElement("small"); s.textContent = meta; div.appendChild(s); }
    log.appendChild(div); log.scrollTop = log.scrollHeight;
    return div;
  }
  function render() {
    log.innerHTML = "";
    if (!history.length) add("assistant", "Halo! Tanyakan tentang laporan keuangan atau kanban di dashboard ini.");
    history.forEach(function (t) { add(t.role, t.text, t.meta); });
  }
  function ask(text) {
    text = text.trim(); if (!text) return;
    var prior = history.map(function (t) { return {role: t.role, text: t.text}; });
    history.push({role: "user", text: text}); add("user", text);
    var wait = add("assistant", "Sedang berpikir…");
    send.disabled = true; input.disabled = true;
    fetch(URL, {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF},
      body: JSON.stringify({message: text, history: prior})})
      .then(function (r) { return r.json().then(function (d) { return {status: r.status, data: d}; }); })
      .then(function (res) {
        wait.remove();
        if (!res.data.ok) { add("assistant", res.data.error || "Terjadi kesalahan."); return; }
        var meta = res.data.source === "fallback" ? "ringkasan laporan (bukan jawaban AI)" : "dijawab oleh " + res.data.source;
        history.push({role: "assistant", text: res.data.answer, meta: meta});
        add("assistant", res.data.answer, meta); save();
      })
      .catch(function () { wait.remove(); add("assistant", "Gagal menghubungi server."); })
      .finally(function () { send.disabled = false; input.disabled = false; input.focus(); });
  }

  fab.addEventListener("click", function () { panel.classList.toggle("open"); if (panel.classList.contains("open")) input.focus(); });
  document.getElementById("agent-chat-close").addEventListener("click", function () { panel.classList.remove("open"); });
  document.getElementById("agent-chat-clear").addEventListener("click", function () { history = []; save(); render(); });
  form.addEventListener("submit", function (e) { e.preventDefault(); var v = input.value; input.value = ""; ask(v); });
  document.querySelectorAll("#agent-chat-suggest button").forEach(function (b) {
    b.addEventListener("click", function () { ask(b.textContent); });
  });
  render();
})();
</script>
