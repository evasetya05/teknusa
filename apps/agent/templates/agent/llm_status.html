{% extends "main/layout.html" %}

{% block content %}
<div class="container mt-5 pt-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
      <li class="breadcrumb-item active" aria-current="page">LLM status</li>
    </ol>
  </nav>
  <h1 class="h3 mb-4">LLM (Llama / Ollama) connection</h1>

  <div class="card mb-3" style="max-width: 640px;">
    <div class="card-body">
      <dl class="row mb-3">
        <dt class="col-sm-4">Mode</dt>
        <dd class="col-sm-8">
          <span class="badge {% if enabled %}bg-success{% else %}bg-secondary{% endif %}">{{ mode }}</span>
        </dd>
        <dt class="col-sm-4">URL</dt>
        <dd class="col-sm-8"><code>{{ local.url }}</code></dd>
        <dt class="col-sm-4">Model</dt>
        <dd class="col-sm-8"><code>{{ local.model }}</code></dd>
        <dt class="col-sm-4">Timeout</dt>
        <dd class="col-sm-8">{{ local.timeout }}s</dd>
      </dl>
      <button id="llm-test-btn" type="button" class="btn btn-primary">
        <i class="fas fa-plug me-1"></i>Run test
      </button>
      <div id="llm-test-result" class="mt-3" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var btn = document.getElementById("llm-test-btn");
  var out = document.getElementById("llm-test-result");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }
  function alertBox(cls, html) {
    out.innerHTML = '<div class="alert alert-' + cls + ' mb-0">' + html + '</div>';
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    alertBox("info", "Testing connection&hellip; (may take up to the timeout)");
    fetch("{% url 'agent:llm_test' %}", {
      method: "POST",
      headers: {"X-CSRFToken": "{{ csrf_token }}"},
      credentials: "same-origin"
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error && !data.results) {
          alertBox("warning", esc(data.error));
          return;
        }
        var html = data.results.map(function (r) {
          return r.ok
            ? '<div><strong>&#10004; ' + esc(r.provider) + '</strong> (' + esc(r.model) + ') connected in ' +
              r.seconds + 's<br><small>Reply: ' + esc(r.response) + '</small></div>'
            : '<div><strong>&#10008; ' + esc(r.provider) + '</strong> (' + esc(r.model) + ') failed after ' +
              r.seconds + 's<br><small>' + esc(r.error) + '</small></div>';
        }).join("");
        alertBox(data.ok ? "success" : "danger", html);
      })
      .catch(function (e) { alertBox("danger", "Request error: " + esc(e.message)); })
      .finally(function () { btn.disabled = false; });
  });
})();
</script>
{% endblock %}
